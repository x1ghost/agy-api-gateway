<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1320" viewBox="0 0 1440 1320" role="img" aria-labelledby="title desc">
<title id="title">客户端、官方 AGY、Gateway 与 Google 的交互时序</title><desc id="desc">客户端请求触发官方 AGY 发出载体请求，Gateway 替换请求体并与 Google 交换真实响应，分流给客户端与 AGY 的占位 ACK。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#727f98"/></marker>
<marker id="violetArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8273c1"/></marker>
<marker id="greenArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#65a188"/></marker>
<style>
.title{font:600 26px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#273750}.small{font:14px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#8290a2}.tag{font:600 11px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#8c9aac;letter-spacing:1.6px}.head{font:600 18px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#2d3c51}.sub{font:13px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#8a97a8}.msg{font:600 15px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#3c4b61}.detail{font:13px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#8492a5}.violet{stroke:#8273c1;stroke-width:2;fill:none;marker-end:url(#violetArrow)}.green{stroke:#65a188;stroke-width:2;fill:none;marker-end:url(#greenArrow)}.gray{stroke:#727f98;stroke-width:2;fill:none;marker-end:url(#arrow)}.life{stroke:#d8e0eb;stroke-width:1.4;stroke-dasharray:5 7}.step{font:600 12px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#8c99ac}
</style></defs>
<rect width="1440" height="1320" rx="22" fill="#fff"/>
<text x="58" y="62" class="tag">ONE REQUEST / FOUR PARTICIPANTS</text><text x="58" y="104" class="title">从一次请求，看四方如何交流。</text><text x="58" y="134" class="small">从上往下阅读；每条横线表示消息方向，工具结果开启下一轮。</text>
<rect x="48" y="171" width="320" height="1042" rx="18" fill="#f7f9fc"/><rect x="390" y="171" width="320" height="1042" rx="18" fill="#f8f9fc"/><rect x="732" y="171" width="320" height="1042" rx="18" fill="#f6f3fc"/><rect x="1074" y="171" width="318" height="1042" rx="18" fill="#f2f8f5"/>
<text x="72" y="205" class="tag">01 / CLIENT</text><text x="72" y="237" class="head">User / Claude Code</text><text x="72" y="262" class="sub">保管上下文 · 执行工具</text>
<text x="414" y="205" class="tag">02 / OFFICIAL CLI</text><text x="414" y="237" class="head">官方 AGY CLI</text><text x="414" y="262" class="sub">登录认证 · 发起载体请求</text>
<text x="756" y="205" class="tag">03 / OUR SERVICE</text><text x="756" y="237" class="head">Gateway</text><text x="756" y="262" class="sub">协议转换 · 本机私有代理</text>
<text x="1098" y="205" class="tag">04 / PROVIDER</text><text x="1098" y="237" class="head">Google</text><text x="1098" y="262" class="sub">接收请求 · 返回模型响应</text>
<path d="M208 289V1174 M550 289V1174 M892 289V1174 M1233 289V1174" class="life"/>
<text x="72" y="317" class="step">01</text><text x="238" y="319" class="msg">Messages 请求</text><text x="238" y="340" class="detail">system、历史、工具与参数</text><path d="M208 356H884" class="violet"/>
<text x="414" y="416" class="step">02</text><text x="588" y="417" class="msg">启动载体轮次</text><text x="588" y="438" class="detail">网关让已登录的 AGY CLI 发起请求</text><path d="M892 454H558" class="gray"/>
<text x="414" y="514" class="step">03</text><text x="588" y="515" class="msg">官方 CLI 发出载体请求</text><text x="588" y="536" class="detail">请求进入 Gateway 的本机代理</text><path d="M550 552H884" class="gray"/>
<text x="756" y="612" class="step">04</text><text x="929" y="613" class="msg">替换 body，转发给 Google</text><text x="929" y="634" class="detail">保留官方认证和路由外壳</text><path d="M892 650H1225" class="violet"/>
<text x="756" y="710" class="step">05</text><text x="929" y="711" class="msg">真实模型响应（SSE）</text><text x="929" y="732" class="detail">文本、工具调用和本次 usage</text><path d="M1233 748H900" class="green"/>
<text x="72" y="808" class="step">06</text><text x="238" y="809" class="msg">真实响应转换后返回客户端</text><text x="238" y="830" class="detail">正文可流式转发；完整工具调用确认后交给客户端</text><path d="M892 846H216" class="green"/>
<text x="414" y="906" class="step">07</text><text x="588" y="907" class="msg">向 AGY CLI 返回占位 ACK</text><text x="588" y="928" class="detail">仅结束载体轮次，不是模型回答</text><path d="M892 944H558" class="gray"/>
<text x="72" y="1004" class="step">08</text><text x="238" y="1005" class="msg">客户端执行工具，结果进入下一次请求</text><text x="238" y="1026" class="detail">然后再次发起载体请求并替换 body，如此往复</text><path d="M208 1042H884" class="violet"/>
<rect x="72" y="1093" width="1294" height="74" rx="12" fill="#fff" opacity=".94"/><text x="92" y="1122" class="msg">两条返回路径</text><text x="92" y="1147" class="detail">真实模型响应 → 客户端　　·　　占位 ACK → AGY CLI　　·　　CLI 不执行客户端工具</text>
<text x="58" y="1271" class="small">静态架构说明 · 不展示实时状态、账号、凭据或对话内容</text>
</svg>
